<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Monthly Spend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow centered column — salary, expense list, add row, summary */
:root {
  --bg: #f6f7f5;
  --surface: #ffffff;
  --fg: #1d221f;
  --muted: #6b736e;
  --line: #dfe3e0;
  --accent: #2f6f57;
  --warn: #b5482f;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --surface: #1c211e; --fg: #e8ece9; --muted: #98a19c;
    --line: #2d3430; --accent: #6fbf9c; --warn: #e88a72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --surface: #1c211e; --fg: #e8ece9; --muted: #98a19c;
  --line: #2d3430; --accent: #6fbf9c; --warn: #e88a72; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding: 48px 16px;
  display: flex; justify-content: center;
}
main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 28px; text-align: center; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2rem; margin: 0; letter-spacing: -0.02em; }
.sub { color: var(--muted); margin: 4px 0 0; }
label.cap, .cap { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
input {
  font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%;
  font-variant-numeric: tabular-nums;
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input.err { border-color: var(--warn); }
.salary { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.salary input { text-align: center; font-family: var(--display); font-size: 1.6rem; font-weight: 500; max-width: 260px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; grid-template-columns: 1fr 110px 56px 32px; gap: 8px; align-items: center; }
.row .name { text-align: left; padding: 6px 0; min-width: 0; overflow-wrap: anywhere; }
.hint { display: block; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.freq { height: 32px; font-size: 0.8rem; color: var(--muted); }
.freq.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.days { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: center; }
.days button { border: 0; border-radius: 0; padding: 6px 14px; color: var(--muted); }
.days button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }
.daysWrap { display: flex; flex-direction: column; gap: 8px; align-items: center; }
select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px; }
.row input.amt { text-align: right; }
.tag { font-size: 0.7rem; color: var(--accent); margin-left: 6px; }
button {
  font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
  background: transparent; color: var(--fg);
}
.x { width: 32px; height: 32px; color: var(--muted); font-size: 1.1rem; line-height: 1; }
.x:hover { color: var(--warn); border-color: var(--warn); }
.add { display: grid; grid-template-columns: 1fr 100px 90px; gap: 8px; }
.add button { grid-column: 1 / -1; background: var(--accent); color: var(--bg); border-color: var(--accent); padding: 10px; font-weight: 600; }
.msg { color: var(--warn); font-size: 0.85rem; min-height: 1.2em; margin: 0; }
.summary { border-top: 1px solid var(--line); padding-top: 24px; display: flex; flex-direction: column; gap: 14px; }
.figures { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
.fig b { display: block; font-family: var(--display); font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.neg b { color: var(--warn); }
.pos b { color: var(--accent); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.bar.over span { background: var(--warn); }
.reset { color: var(--muted); padding: 6px 12px; font-size: 0.85rem; align-self: center; }
@media (max-width: 420px) { .row { grid-template-columns: 1fr 88px 52px 32px; } .add { grid-template-columns: 1fr 1fr; } .add #newTitle { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>

<main>
  <header>
    <h1>Monthly Spend</h1>
    <p class="sub">Enter your salary and expenses. Everything is in MAD.</p>
  </header>

  <section class="salary">
    <label class="cap" for="salary">Monthly salary</label>
    <input id="salary" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
  </section>

  <section class="daysWrap">
    <span class="cap" id="daysLabel">Days in month (for daily expenses)</span>
    <div class="days" role="group" aria-labelledby="daysLabel">
      <button type="button" id="d30" aria-pressed="true">30 days</button>
      <button type="button" id="d31" aria-pressed="false">31 days</button>
    </div>
  </section>

  <section>
    <p class="cap">Expenses — tap /mo or /day to switch</p>
    <div class="list" id="list"></div>
  </section>

  <form class="add" id="addForm" novalidate>
    <input id="newTitle" type="text" placeholder="Custom expense title" maxlength="40">
    <input id="newAmt" type="number" min="0" step="any" inputmode="decimal" placeholder="Amount">
    <select id="newFreq" aria-label="Frequency"><option value="month">/ month</option><option value="day">/ day</option></select>
    <button type="submit">Add expense</button>
    <p class="msg" id="msg" style="grid-column:1/-1"></p>
  </form>

  <section class="summary">
    <div class="figures">
      <div class="fig"><span class="cap">Spent</span><b id="spent">0</b></div>
      <div class="fig" id="leftBox"><span class="cap">Left</span><b id="left">0</b></div>
    </div>
    <div class="bar" id="bar"><span id="fill"></span></div>
    <p class="sub" id="pct">0% of salary spent</p>
    <button class="reset" id="reset" type="button">Reset to defaults</button>
  </section>
</main>

<script>
const DEFAULTS = [
  { title: "Rent", amount: 3500 },
  { title: "Groceries", amount: 1800 },
  { title: "Transport", amount: 20, daily: true },
  { title: "Coffee & snacks", amount: 15, daily: true },
  { title: "Electricity & water", amount: 350 },
  { title: "Internet & phone", amount: 250 },
];
const KEY = "monthly-spend-v1";
let state = { salary: 10000, days: 30, items: DEFAULTS.map(d => ({ daily: false, ...d, custom: false })) };

try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.items)) state = s; } catch (e) {}
if (state.days !== 31) state.days = 30;
const monthly = it => (it.amount || 0) * (it.daily ? state.days : 1);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const fmt = n => n.toLocaleString("fr-MA", { maximumFractionDigits: 2 }) + " DH";
const $ = id => document.getElementById(id);

function render() {
  $("salary").value = state.salary || "";
  const list = $("list");
  list.innerHTML = "";
  state.items.forEach((it, i) => {
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = it.title;
    if (it.custom) { const t = document.createElement("span"); t.className = "tag"; t.textContent = "custom"; name.append(t); }
    const hint = document.createElement("span");
    hint.className = "hint"; hint.dataset.i = i;
    name.append(hint);
    const amt = document.createElement("input");
    amt.type = "number"; amt.min = "0"; amt.step = "any"; amt.className = "amt";
    amt.id = "amt-" + i; amt.value = it.amount || ""; amt.placeholder = "0";
    amt.setAttribute("aria-label", it.title + " amount");
    amt.addEventListener("input", () => { it.amount = parseFloat(amt.value) || 0; update(); });
    const x = document.createElement("button");
    x.type = "button"; x.className = "x"; x.textContent = "×";
    x.setAttribute("aria-label", "Remove " + it.title);
    x.addEventListener("click", () => { state.items.splice(i, 1); render(); });
    const fq = document.createElement("button");
    fq.type = "button"; fq.className = "freq" + (it.daily ? " on" : "");
    fq.textContent = it.daily ? "/day" : "/mo";
    fq.setAttribute("aria-label", it.title + ": switch between per day and per month");
    fq.addEventListener("click", () => { it.daily = !it.daily; render(); });
    row.append(name, amt, fq, x);
    list.append(row);
  });
  update();
}

function update() {
  const spent = state.items.reduce((s, it) => s + monthly(it), 0);
  document.querySelectorAll(".hint").forEach(h => {
    const it = state.items[h.dataset.i];
    h.textContent = it && it.daily ? `${fmt(it.amount || 0)} × ${state.days} = ${fmt(monthly(it))}` : "";
  });
  $("d30").setAttribute("aria-pressed", state.days === 30);
  $("d31").setAttribute("aria-pressed", state.days === 31);
  const salary = state.salary || 0;
  const left = salary - spent;
  const pct = salary ? (spent / salary) * 100 : 0;
  $("spent").textContent = fmt(spent);
  $("left").textContent = fmt(left);
  $("leftBox").className = "fig " + (left < 0 ? "neg" : "pos");
  $("fill").style.width = Math.min(pct, 100) + "%";
  $("bar").classList.toggle("over", pct > 100);
  $("pct").textContent = salary
    ? (pct > 100 ? `Over budget by ${fmt(-left)}` : `${pct.toFixed(1)}% of salary spent`)
    : "Enter your salary to see what's left";
  save();
}

$("salary").addEventListener("input", e => { state.salary = parseFloat(e.target.value) || 0; update(); });
$("d30").addEventListener("click", () => { state.days = 30; update(); });
$("d31").addEventListener("click", () => { state.days = 31; update(); });

$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const title = $("newTitle").value.trim();
  const amount = parseFloat($("newAmt").value) || 0;
  $("newTitle").classList.toggle("err", !title);
  if (!title) { $("msg").textContent = "Give the expense a title first."; $("newTitle").focus(); return; }
  $("msg").textContent = "";
  state.items.push({ title, amount, custom: true, daily: $("newFreq").value === "day" });
  $("newTitle").value = ""; $("newAmt").value = "";
  render();
});
$("newTitle").addEventListener("input", () => { $("newTitle").classList.remove("err"); $("msg").textContent = ""; });

// Keep the unsent custom expense draft too
const DRAFT = "monthly-spend-draft";
try { const d = JSON.parse(localStorage.getItem(DRAFT)) || {}; $("newTitle").value = d.title || ""; $("newAmt").value = d.amount || ""; } catch (e) {}
const saveDraft = () => { try { localStorage.setItem(DRAFT, JSON.stringify({ title: $("newTitle").value, amount: $("newAmt").value })); } catch (e) {} };
$("newTitle").addEventListener("input", saveDraft);
$("newAmt").addEventListener("input", saveDraft);
$("addForm").addEventListener("submit", () => setTimeout(saveDraft, 0));

let armed = false;
$("reset").addEventListener("click", () => {
  if (!armed) { armed = true; $("reset").textContent = "Click again to confirm"; setTimeout(() => { armed = false; $("reset").textContent = "Reset to defaults"; }, 3000); return; }
  armed = false; $("reset").textContent = "Reset to defaults";
  state = { salary: 0, days: state.days, items: DEFAULTS.map(d => ({ daily: false, ...d, amount: 0, custom: false })) };
  render();
});

render();
</script>

</body></html>
